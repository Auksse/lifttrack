<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport-fit=cover lets the app paint into the safe areas; the CSS then
    pads by env(safe-area-inset-*). Note there is deliberately no
    `user-scalable=no`: iOS Safari ignores it anyway, and blocking zoom is an
    accessibility failure. The zoom-on-focus problem it was there to solve is
    handled properly instead — every input is >=16px (see components.css).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Offline-first strength training log with progressive overload tracking." />
  <meta name="theme-color" content="#0c0b0a" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LiftTrack" />
  <link rel="apple-touch-icon" href="./icon-180.png" />

  <title>LiftTrack</title>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
