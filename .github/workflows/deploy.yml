# Build LiftTrack and publish it through the Pages Actions pipeline.
#
# Publishes to the SAME url the home-screen app is installed at —
# https://auksse.github.io/lifttrack/ — so pushing to main updates the app
# already on the phone. No re-install, no re-adding to the home screen.
#
# WHY THIS SHAPE
#
# The repo's Pages source is set to "GitHub Actions". That source ignores
# the `gh-pages` branch entirely, so the previous branch-pushing pipeline
# published to somewhere nothing was reading. Deployment now goes through
# upload-pages-artifact + deploy-pages, which is what that source consumes.
#
# ABOUT THE 30-MINUTE TIMEOUT
#
# deploy-pages defaults to giving up after 10 minutes. The Pages backend on
# this repo has been taking 10-15 minutes to publish, so that default turned
# slow-but-successful publishes into red X's — the content went live a few
# minutes after the job had already declared failure. 1800000ms (30 min) is
# long enough to wait it out and report the truth.
#
# ONE-TIME SETUP (already done, noted for the record):
#   GitHub → repo Settings → Pages → Build and deployment → Source:
#   "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight: a half-applied Pages deployment is
# worse than a slightly stale one, and runs here are slow enough that a
# cancellation would likely land mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare artifact
        run: |
          # Stop Jekyll from processing the output on the Pages side.
          touch dist/.nojekyll
          # SPA fallback: any deep link resolves to the app shell.
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Comfortably past the step's own 30-minute timeout, so the step is what
    # decides the outcome rather than the runner being killed underneath it.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Milliseconds. See the note at the top of this file.
          timeout: 1800000
