# Build LiftTrack and publish it to the `gh-pages` branch.
#
# Publishes to the SAME url the home-screen app is installed at —
# https://auksse.github.io/lifttrack/ — so pushing to main updates the app
# already on the phone. No re-install, no re-adding to the home screen.
#
# WHY A BRANCH AND NOT actions/deploy-pages
#
# The Actions-native deployment path failed repeatedly on this repo: the
# build always succeeded, the artifact uploaded, the deployment reached
# `in_progress`, and then the Pages service never reported completion —
# "Timeout reached, aborting!" every time, with a 1.1 MB / 19 file
# artifact and Pages reporting no incidents. Rather than keep guessing at
# a service-side failure, this uses the classic branch pipeline, which has
# a long record of succeeding on this repo.
#
# EXPECT GITHUB'S OWN RUN TO GO RED — IT IS LYING
#
# Pushing to `gh-pages` also triggers GitHub's auto-generated "pages build
# and deployment" run. On this repo the Pages backend currently takes
# ~15 minutes to publish, and that run's deploy job gives up at 10, so it
# reports "Timeout reached, aborting!" and shows a red X. The content is
# published anyway, a few minutes later. (Verified: job failed 13:40:53,
# site Last-Modified 13:55:22, serving the correct build.)
#
# We cannot change that run's timeout. Instead the final step below polls
# the live URL until it serves *this* build, so this workflow's green tick
# means the app on the phone is genuinely updated. Trust this one; ignore
# the auto-generated one.
#
# ONE-TIME SETUP (cannot be automated from here):
#   GitHub → repo Settings → Pages → Build and deployment → Source:
#   "Deploy from a branch", Branch: `gh-pages`, folder: `/ (root)`.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push matters. Superseded runs stand down rather than
# queueing, which also keeps us under Pages' build-rate allowance.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Generous: the build is ~1 minute, the rest is waiting on Pages.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare artifact
        run: |
          # Stop Jekyll from processing the output on the Pages side.
          touch dist/.nojekyll
          # SPA fallback: any deep link resolves to the app shell.
          cp dist/index.html dist/404.html

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd dist
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          # Force-push: gh-pages is a build output, it has no history worth
          # preserving and should always mirror the latest main exactly.
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the live site to serve this build
        run: |
          set -uo pipefail
          # Vite hashes the entry filename from its contents, so finding this
          # exact name on the live site proves the new build is being served
          # rather than a cached older one.
          marker=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          echo "Waiting for $URL to serve $marker"

          for i in $(seq 1 60); do
            # Cache-bust the query string; Pages sets max-age=600 on HTML.
            if curl -fsSL "$URL?ci=$GITHUB_RUN_ID-$i" | grep -qF "$marker"; then
              echo "Live after roughly $((i * 15)) seconds."
              exit 0
            fi
            sleep 15
          done

          echo "::error::Still not serving $marker after 15 minutes."
          exit 1
        env:
          URL: https://auksse.github.io/lifttrack/
